name: Kubernetes CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check yamllint==1.38.0 -r api/requirements-dev.txt
      - name: Install pinned Kubernetes validation tools
        run: bash scripts/install-tools.sh
      - name: Add local tools to PATH
        run: echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: Lint Python
        run: cd api && ruff check app tests
      - name: Run API unit tests
        run: cd api && pytest -q
      - name: Validate Kubernetes manifests and security
        run: bash scripts/validate.sh

  kind-smoke:
    needs: static-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Install pinned Kubernetes tools
        run: bash scripts/install-tools.sh
      - name: Add local tools to PATH
        run: echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: Create cluster and deploy development overlay
        run: bash scripts/cluster.sh create
      - name: Run application smoke test through Ingress
        run: |
          kubectl --namespace ingress-nginx port-forward service/ingress-nginx-controller 18080:80 \
            > ingress-port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --header "Host: task.localhost" \
              http://127.0.0.1:18080/healthz > /dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat ingress-port-forward.log
              exit 1
            fi
            sleep 2
          done

          BASE_URL=http://127.0.0.1:18080 bash scripts/smoke-test.sh
      - name: Demonstrate controlled rollback
        run: bash scripts/rollback-demo.sh
      - name: Collect diagnostics
        if: always()
        run: |
          kubectl get all -A
          kubectl get events -A --sort-by=.lastTimestamp | tail -100
          kubectl describe pods -n task-app || true
          kubectl describe pods -n task-data || true
          kubectl describe pods -n ingress-nginx || true
          kubectl logs -n ingress-nginx deployment/ingress-nginx-controller --tail=150 || true
          kubectl logs -n task-app -l app.kubernetes.io/name=api --all-containers --prefix --tail=100 || true
          kubectl logs -n task-app -l app.kubernetes.io/name=frontend --all-containers --prefix --tail=100 || true
          kubectl logs -n task-data -l app.kubernetes.io/name=postgres --all-containers --prefix --tail=100 || true
          cat ingress-port-forward.log || true
      - name: Delete kind cluster
        if: always()
        run: bash scripts/cluster.sh delete
